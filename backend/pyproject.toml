[project]
name = "pr-review-backend"
version = "0.1.0"
description = "Agentic PR review backend"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain[openai]>=1.4.3",
    "langgraph>=1.2.12",
    "python-dotenv>=1.2.4",
    "unidiff>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can `import app` without installing the package
