[project]
name = "pr-review-backend"
version = "0.1.0"
description = "Agentic PR review backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langchain[openai]>=1.4.3",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.3",
    "unidiff>=1.0.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fakeredis>=2.39.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can `import app` without installing the package
